name: helloworld
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  http:
  flutter:
    sdk: flutter
  sqflite: any
  path: any
  path_provider: any
  firebase_core: ^3.11.0
  firebase_auth: ^5.5.0
  google_sign_in: ^6.2.2
  logger: ^2.7.0
  shared_preferences: ^2.5.5
  oktoast: ^3.0.0
  toastification: any
  vibration: ^3.1.3
  translator: ^0.1.7
  fl_chart: ^0.70.2

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  mobile_scanner: ^6.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "lib/resources/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - lib/resources/logo.png
    - lib/resources/profile.png
    - lib/resources/icono_gato.png
    - lib/resources/icono_mundo.png
    - lib/resources/no-image-icon.png
